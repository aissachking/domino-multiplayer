# يبني ملف APK لتطبيق «تشكيلة» تلقائيًا، وينشره برابط تحميل مباشر ثابت:
# https://github.com/<المالك>/<المستودع>/releases/download/tashkila-apk/tashkila.apk
name: بناء تطبيق Android

on:
  push:
    branches: [main, tashkila]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: تثبيت الحزم
        run: npm install
      - name: بناء نسخة الويب
        run: npm run build
      - name: إنشاء مشروع Android
        run: |
          npx cap add android
          npx cap sync android
      - name: إعداد الحفظ في الهاتف ورقم الإصدار
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # إذن الكتابة للأجهزة القديمة (Android 10 وما قبله) فقط
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application android:requestLegacyExternalStorage="true"#' $M
          # رقم إصدار يزيد مع كل بناء حتى يُثبَّت التحديث فوق النسخة السابقة
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "requestLegacy\|WRITE_EXTERNAL" $M
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: بناء APK
        working-directory: android
        run: |
          # مفتاح توقيع ثابت: كل تحديث يُثبَّت فوق السابق دون حذف التطبيق وبياناته
          mkdir -p ~/.android
          cp ../android-keys/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../tashkila.apk
      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tashkila-apk
          name: تطبيق تشكيلة (Android)
          body: آخر نسخة من تطبيق «تشكيلة». حمّل tashkila.apk وثبّته على هاتفك.
          make_latest: false
          files: tashkila.apk
